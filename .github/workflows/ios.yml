name: iPhone
# The iPhone app (ios/): its C side run headless on the diagnostic ROMs, then an unsigned .ipa for sideloading
# (AltStore / SideStore sign it with the player's own Apple ID). The .ipa is the run's PokeDaisy-iOS artifact.
on:
  pull_request:
    paths: ['ios/**', '3ds/core/**', '3ds/host/**', '3ds/emu/pd_dispatch.c', '3ds/emu/pd_armgba.h', '3ds/emu/pd_gpsp.h', 'app/src/main/cpp/**', 'linux/*.c', 'linux/*.h', 'third_party/mgba', 'gamedata/**', '.github/workflows/ios.yml']
  push:
    branches: [main, dev, ios-duo]
    paths: ['ios/**', '3ds/core/**', '3ds/host/**', '3ds/emu/pd_dispatch.c', '3ds/emu/pd_armgba.h', '3ds/emu/pd_gpsp.h', 'app/src/main/cpp/**', 'linux/*.c', 'linux/*.h', 'third_party/mgba', 'gamedata/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: git submodule update --init --depth 1 third_party/mgba
      - name: Build the C side and its smoke test
        run: |
          cmake -S ios/core -B "$RUNNER_TEMP/ios-core" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ios-core" --target pd_ios_smoke -j2
      - name: Run it on the diagnostic ROMs
        run: |
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/linux/make_diagnostic.py"
          for rom in diagnostic.gba diagnostic.gb; do
            "$RUNNER_TEMP/ios-core/pd_ios_smoke" "$rom" "out-$rom"
          done

  ipa:
    # GitHub's xcode-27 image (a preview: macOS 27, Xcode 27 with the iOS 27.1 SDK and the iPhone Duo simulator), the runner the
    # owner's bcd-games fork builds on: macos-15 / macos-15-intel jobs were never picked up for this fork (2026-11-18).
    # iPhone Duo lays an app out by the SDK its executable records (LC_BUILD_VERSION): built with an SDK older than iOS 27.1 it
    # runs centred on the inner display with empty space around it (Apple, "Prepare your app for iPhone Duo").
    needs: smoke
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: git submodule update --init --depth 1 third_party/mgba
      - name: Select the newest stable Xcode
        run: |
          # Links (Xcode_27.2.app -> Xcode_27.2_Release_Candidate.app) resolved first; a beta / RC only if nothing else is there.
          REAL=$(for x in /Applications/Xcode*.app; do readlink -f "$x"; done 2>/dev/null | sort -u)
          NEWEST=$(printf '%s\n' "$REAL" | grep -viE 'beta|release_candidate|_rc\b|-rc\b' | sort -V | tail -1)
          [ -n "$NEWEST" ] || NEWEST=$(printf '%s\n' "$REAL" | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; echo "::notice::selected $NEWEST"; fi
          xcodebuild -version
          echo "::notice::iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: The C side for arm64 iPhones
        run: sh ios/build_core.sh
      - name: The app (unsigned)
        run: |
          xcodegen generate --spec ios/project.yml
          xcodebuild -project ios/PokeDaisy.xcodeproj -scheme PokeDaisy -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -60 | sed 's/^/::error::/'; tail -40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          grep -E "warning: .*/ios/App/" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -40 || true
          tail -3 "$RUNNER_TEMP/xcodebuild.log"
      - name: iPhone Duo's whole inner display (iOS 27.1 SDK)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/PokeDaisy.app"
          v=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "$(printf '%s\n' 27.1 "$v" | sort -V | head -1)" = "27.1" ]; then
            echo "::notice::iOS SDK $v: built for the whole inner display, no stamp needed"; exit 0
          fi
          # The bcd-games way: the executable stamped as built with the 27.1 SDK (minimum iOS kept), and the Info.plist with it.
          minos=$(xcrun vtool -show-build "$APP/PokeDaisy" | awk '$1 == "minos" {print $2; exit}')
          xcrun vtool -set-build-version ios "$minos" 27.1 -replace -output "$APP/PokeDaisy.stamped" "$APP/PokeDaisy"
          mv -f "$APP/PokeDaisy.stamped" "$APP/PokeDaisy"
          chmod 755 "$APP/PokeDaisy"
          /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos27.1" -c "Set :DTPlatformVersion 27.1" "$APP/Info.plist"
          echo "::warning::iOS SDK $v is older than 27.1: stamped as built with 27.1 so iPhone Duo uses the whole inner display"
      - name: Package the .ipa
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/PokeDaisy.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry PokeDaisy-iOS.ipa Payload)
          ls -la "$RUNNER_TEMP/ipa/PokeDaisy-iOS.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PokeDaisy-iOS
          path: ${{ runner.temp }}/ipa/PokeDaisy-iOS.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
