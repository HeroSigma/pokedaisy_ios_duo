# The iPhone app's Xcode project, generated by XcodeGen (brew install xcodegen; xcodegen generate --spec ios/project.yml).
# The generated PokeDaisy.xcodeproj isn't committed. The C side (ios/core) is built first by ios/build_core.sh into
# ios/build/lib/libpokedaisy_core.a, which this links.
name: PokeDaisy
options:
  bundleIdPrefix: com.pokedaisy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PokeDaisy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: PokeDaisy
        PRODUCT_BUNDLE_IDENTIFIER: com.pokedaisy.ios
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/PokeDaisy-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/core"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/lib"
        OTHER_LDFLAGS: "-lpokedaisy_core -lz"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        # Sideloaded (AltStore / SideStore sign it with your Apple ID): the CI build is unsigned.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
