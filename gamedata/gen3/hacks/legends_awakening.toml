# Pokémon Legends Awakening
# Experimental pokeemerald-expansion profile.
# Addresses from the November 23, 2026 ELF.
# ROM SHA-1: 552ec33df5b6c31409fee1b8e5346e4a8de83ce9
#
# Inherited Emerald addresses and layouts are not yet
# verified. Do not enable unsupported companion features.

[config.legends_awakening]
base = 'emerald'

playerParty = 0x02038E5C
playerPartyCount = 0x020397BC

battleMons = 0x02000468
battleTypeFlags = 0x020006D0
battlerPositions = 0x020006AC
battlersCount = 0x020006B8

gMain = 0x030065E0
mapHeader = 0x020027A0
bagPockets = 0x020077FC

saveBlock1Ptr = 0x030050E8
saveBlock2Ptr = 0x030050E4

speciesMask = 0x07FF
moveMask = 0x07FF
ppMask = 0x7F

# ROM-specific native icon table layout.
# The matching ROM's GetMonIconTilesIsEgg at 0x081930C8:
# species * (33 * 8) = species * 0x108
# reads iconSprite at +0x68, female iconSprite at +0x7C.
# In the enabled-gender/footprint source layout iconPalIndex follows
# footprint pointer (+0x80) and 6 size bytes (+0x84..0x89): +0x8A.
# Palette table is gMonIconPaletteTable from the matching ELF.
# Note: UI currently renders standard icons, without female personality.
# SPECIES_EGG = 1574 in Legends-Awakening-Reborn/include/constants/species.h.
eggSpecies = 1574
monIconTable = 0x0876A3B0
monIconStride = 0x108
monIconPaletteIndices = 0x0876A3D2
monPalIdxStride = 0x108
monPalIdxMask = 0x07
monIconPaletteTable = 0x08D09A9C
